info:
  name: one-county-with-sorted-cities
  type: http
  seq: 16

http:
  method: GET
  url: http://localhost:8000/api/counties/10?sort_by=population&sort_dir=desc
  params:
    - name: sort_by
      value: population
      type: query
    - name: sort_dir
      value: desc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
